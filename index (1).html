<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>747 — Daily Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14140f; --surface:#1c1c16; --surface-2:#24241c; --line:#33321f;
    --ink:#f2efe4; --muted:#9c9a8c;
    --gold:#c9a15a; --sage:#8aa07b; --teal:#5b8a82; --lav:#9891b8; --danger:#b5654a; --green:#7fae72; --red:#b5654a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  .main{max-width:1080px;margin:0 auto;padding:28px 32px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .brand small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
  .tabbar{display:flex;gap:6px;}
  .tabbtn{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:8px 18px;border-radius:20px;cursor:pointer;}
  .tabbtn.active{background:var(--gold);color:#14140f;border-color:var(--gold);}
  .datebar{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;margin:0 0 20px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  .card h2{font-family:'Fraunces',serif;font-weight:500;font-size:15px;margin:0 0 12px 0;color:var(--gold);display:flex;justify-content:space-between;align-items:center;}
  .checkin-q{font-size:13.5px;color:var(--muted);margin-bottom:9px;font-style:italic;}
  textarea,input[type=text],input[type=number],select,input[type=date],input[type=time]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;}
  textarea{resize:vertical;min-height:54px;}
  button.primary{background:var(--gold);color:#14140f;border:none;border-radius:6px;padding:8px 14px;font-weight:600;font-size:12.5px;cursor:pointer;}
  button.primary:hover{opacity:.9;}
  button.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
  button.ghost:hover{color:var(--ink);border-color:var(--muted);}
  .taskrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
  .taskrow:last-child{border-bottom:none;}
  .taskrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);flex-shrink:0;}
  .taskrow .title{flex:1;font-size:13.5px;}
  .taskrow.done .title{text-decoration:line-through;color:var(--muted);}
  .taskrow .time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:3px 6px;border-radius:4px;flex-shrink:0;}
  .tag.content{background:rgba(201,161,90,.15);color:var(--gold);}
  .tag.design{background:rgba(138,160,123,.15);color:var(--sage);}
  .tag.ugc{background:rgba(91,138,130,.15);color:var(--teal);}
  .tag.learning{background:rgba(152,145,184,.15);color:var(--lav);}
  .tag.personal{background:rgba(197,197,197,.12);color:var(--muted);}
  .addrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .addrow input[type=text]{flex:1;min-width:120px;}
  .addrow select{width:118px;flex-shrink:0;}
  .addrow input[type=time],.addrow input[type=date],.addrow input[type=number]{width:100px;flex-shrink:0;}
  .empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:6px 0;}
  .miniitem{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;gap:6px;}
  .miniitem:last-child{border-bottom:none;}
  .miniitem .name{flex:1;}
  .miniitem select{width:auto;font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:3px 5px;text-transform:uppercase;}
  .smallx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 3px;flex-shrink:0;}
  .smallx:hover{color:var(--danger);}
  .logentry{border-left:2px solid var(--gold);padding:3px 0 3px 10px;margin-bottom:8px;font-size:12px;}
  .logdate{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
  .loadmsg{color:var(--muted);padding:40px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .today-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  @media(max-width:900px){.today-grid{grid-template-columns:1fr;}}
  .hourrow{display:flex;border-bottom:1px solid var(--line);min-height:30px;}
  .hourrow:last-child{border-bottom:none;}
  .hourlabel{width:54px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);padding-top:6px;}
  .hourtasks{flex:1;padding:4px 0;display:flex;flex-direction:column;gap:3px;}
  .timeblock{border-left:3px solid var(--gold);background:var(--surface-2);border-radius:4px;padding:4px 8px;font-size:12px;}
  .timeblock.design{border-color:var(--sage);}
  .timeblock.ugc{border-color:var(--teal);}
  .timeblock.learning{border-color:var(--lav);}
  .timeblock.personal{border-color:var(--muted);}
  .timeblock.done{opacity:.45;text-decoration:line-through;}
  .navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .calhead{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:1px;padding-bottom:4px;}
  .calcell{min-height:58px;border:1px solid var(--line);border-radius:6px;padding:5px;cursor:pointer;background:var(--surface-2);}
  .calcell.empty2{border:none;background:none;cursor:default;}
  .calcell.today{border-color:var(--gold);}
  .calcell.selected{background:rgba(201,161,90,.12);}
  .calcell .daynum{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);}
  .caldots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
  .caldot{width:6px;height:6px;border-radius:50%;}
  .caldot.content{background:var(--gold);}
  .caldot.design{background:var(--sage);}
  .caldot.ugc{background:var(--teal);}
  .caldot.learning{background:var(--lav);}
  .caldot.personal{background:var(--muted);}
  .qmonth-title{font-family:'Fraunces',serif;font-size:16px;color:var(--gold);margin-bottom:8px;}
  .statrow{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);}
  .statrow:last-child{border-bottom:none;}
  .statrow .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);}
  .progwrap{margin-bottom:6px;}
  .progbar{width:100%;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:6px;cursor:pointer;}
  .progfill{height:100%;background:var(--gold);}
  .progfill.sage{background:var(--sage);}
  .progfill.teal{background:var(--teal);}
  .proglabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;}
  .milestonelist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  .finrow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
  .finrow:last-child{border-bottom:none;}
  .finrow .amt.in{color:var(--green);}
  .finrow .amt.out{color:var(--red);}
  .bignum{font-family:'Fraunces',serif;font-size:26px;color:var(--ink);}
</style>
</head>
<body>
<div id="root" class="loadmsg">Loading manifest…</div>

<script>
const STORAGE_KEY = 'manifest-state-v1';
const CATEGORIES = ['content','ugc','design','learning','personal'];
const CATEGORY_LABEL = {content:'Content', ugc:'UGC Deal', design:'Design/Portfolio', learning:'Learning', personal:'Personal'};
const STAGES = ['outbound','inbound','negotiating','booked','passed'];
const CHECKIN_PROMPTS = [
  "What does today need from you — not the whole week, just today?",
  "What's the one thing that, if it doesn't happen today, actually costs you something tomorrow?",
  "Where's your energy at, and what's the smallest true version of today's plan?",
  "What are you filming, editing, or pitching today — and is it actually scheduled?",
  "Anything from yesterday that's still sitting unfinished? Name it before you start."
];

function pad(n){ return n.toString().padStart(2,'0'); }
function dateStr(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function todayStr(offsetDays=0){
  const d = new Date();
  d.setDate(d.getDate()+offsetDays);
  return dateStr(d.getFullYear(), d.getMonth(), d.getDate());
}
function fmtDate(str){
  const d = new Date(str+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtHour(h){
  const ampm = h>=12?'PM':'AM';
  let hr = h%12; if(hr===0) hr=12;
  return hr+' '+ampm;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

let state = {
  tasks: [], deals: [], projects: [], log: [],
  finances: { entries: [], subs: [] },
  pitchLog: {},
  milestones: { weavy: [], webflow: [] }
};
let activeTab = 'dashboard';
let loaded = false;
let monthOffset = 0;
let selectedDate = todayStr();
let todayViewDate = todayStr();
let ui = { portfolioExpanded:false, weavyExpanded:false, webflowExpanded:false };

async function loadState(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    if(r && r.value){
      const loadedState = JSON.parse(r.value);
      state = Object.assign({tasks:[],deals:[],projects:[],log:[],finances:{entries:[],subs:[]},pitchLog:{},milestones:{weavy:[],webflow:[]}}, loadedState);
    }
  }catch(e){}
  loaded = true;
  const t0 = todayStr();
  const calendarSeeds = [
    {title:'Filming Content', date:t0, time:'10:00', category:'content'},
    {title:'Campaign & Visual Systems Research (YouTube)', date:t0, time:'14:00', category:'learning'},
    {title:'Outreach: Art Directors & Connections', date:t0, time:'16:00', category:'design'},
    {title:'Set up PayPal Account', date:t0, time:'18:00', category:'personal'},
    {title:'Apply for UGC deals on Cohley', date:t0, time:'18:30', category:'ugc'},
    {title:'Film: Mana and Omnipemf (2 videos)', date:todayStr(1), time:'10:00', category:'content'},
    {title:'Film/Edit: Fashion Content', date:todayStr(2), time:'10:00', category:'content'},
    {title:'Art Direction Study: Lighting focus', date:todayStr(3), time:'11:00', category:'design'},
    {title:'Art Direction Study: Lighting focus', date:todayStr(4), time:'11:00', category:'design'},
    {title:'Finish Portfolio/Template Goal', date:todayStr(6), time:'', category:'design'}
  ];
  calendarSeeds.forEach(seed=>{
    const exists = state.tasks.some(t=>t.title===seed.title && t.date===seed.date);
    if(!exists) state.tasks.push({id:uid(), title:seed.title, category:seed.category, date:seed.date, time:seed.time, done:false, fromCalendar:true});
  });
  if(!state.deals.some(d=>d.brand==='Chime' && d.date===t0)){
    state.deals.push({id:uid(), brand:'Chime', stage:'outbound', date:t0, notes:'', value:800});
    state.pitchLog[t0] = (state.pitchLog[t0]||0)+1;
  }
  ['Moonsleep','Omnilux'].forEach(brand=>{
    if(!state.deals.some(d=>d.brand===brand && d.date===t0)){
      state.deals.push({id:uid(), brand:brand, stage:'outbound', date:t0, notes:'', value:0});
      state.pitchLog[t0] = (state.pitchLog[t0]||0)+1;
    }
  });
  if(state.projects.filter(p=>p.type==='portfolio').length===0){
    ['Outreach to Art Directors (ADPList/LinkedIn) to define portfolio visual-system requirements',
     'Study visual system fundamentals',
     'Analyze 3 campaigns against the framework: visual system, concept, market gap, what is/isn\'t working, your improvements',
     'Turn findings into portfolio direction + case-study structure'
    ].forEach(title=>state.projects.push({id:uid(), name:title, type:'portfolio', status:'active', notes:''}));
    saveState();
  }
  render();
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error('save failed', e); }
}
function setTab(t){ activeTab = t; render(); }

// tasks
function addTask(title, category, date, time){
  if(!title.trim()) return;
  state.tasks.push({id:uid(), title:title.trim(), category, date, time:time||'', done:false});
  saveState(); render();
}
function toggleTask(id){ const t = state.tasks.find(t=>t.id===id); if(t) t.done = !t.done; saveState(); render(); }
function deleteTask(id){ state.tasks = state.tasks.filter(t=>t.id!==id); saveState(); render(); }
function pushUnfinishedToTomorrow(){
  const t0 = todayStr(); const t1 = todayStr(1);
  let moved = 0;
  state.tasks.forEach(t=>{ if(t.date===t0 && !t.done){ t.date = t1; moved++; } });
  saveState(); render();
  return moved;
}
function pushTaskToTomorrow(id){
  const t = state.tasks.find(t=>t.id===id);
  if(!t) return;
  const d = new Date(t.date+'T00:00:00'); d.setDate(d.getDate()+1);
  t.date = dateStr(d.getFullYear(),d.getMonth(),d.getDate());
  saveState(); render();
}
// deals
function addDeal(brand, stage, value){
  if(!brand.trim()) return;
  state.deals.push({id:uid(), brand:brand.trim(), stage, date: todayStr(), notes:'', value: parseFloat(value)||0});
  saveState(); render();
}
function updateDealStage(id, stage){ const d=state.deals.find(d=>d.id===id); if(d) d.stage=stage; saveState(); render(); }
function deleteDeal(id){ state.deals = state.deals.filter(d=>d.id!==id); saveState(); render(); }
// projects (portfolio/client)
function addProject(name, type){
  if(!name.trim()) return;
  state.projects.push({id:uid(), name:name.trim(), type, status:'active', notes:''});
  saveState(); render();
}
function updateProjectStatus(id, status){ const p=state.projects.find(p=>p.id===id); if(p) p.status=status; saveState(); render(); }
function deleteProject(id){ state.projects = state.projects.filter(p=>p.id!==id); saveState(); render(); }
// log
function addLog(text){
  if(!text.trim()) return;
  state.log.unshift({id:uid(), date: todayStr(), text: text.trim()});
  saveState(); render();
}
function deleteLog(id){ state.log = state.log.filter(l=>l.id!==id); saveState(); render(); }
// finances
function addFinanceEntry(type, amount, note){
  const n = parseFloat(amount);
  if(!n || n<=0) return;
  state.finances.entries.push({id:uid(), type, amount:n, note:note.trim(), date:todayStr()});
  saveState(); render();
}
function deleteFinanceEntry(id){ state.finances.entries = state.finances.entries.filter(e=>e.id!==id); saveState(); render(); }
function addSub(name, amount, renewDate){
  const n = parseFloat(amount);
  if(!name.trim()) return;
  state.finances.subs.push({id:uid(), name:name.trim(), amount:n||0, renewDate});
  saveState(); render();
}
function deleteSub(id){ state.finances.subs = state.finances.subs.filter(s=>s.id!==id); saveState(); render(); }
// pitches
function bumpPitch(delta){
  const t0 = todayStr();
  state.pitchLog[t0] = Math.max(0, (state.pitchLog[t0]||0)+delta);
  saveState(); render();
}
// milestones
function addMilestone(track, title){
  if(!title.trim()) return;
  state.milestones[track].push({id:uid(), title:title.trim(), done:false});
  saveState(); render();
}
function toggleMilestone(track, id){
  const m = state.milestones[track].find(m=>m.id===id);
  if(m) m.done = !m.done;
  saveState(); render();
}
function deleteMilestone(track, id){
  state.milestones[track] = state.milestones[track].filter(m=>m.id!==id);
  saveState(); render();
}

function render(){
  const root = document.getElementById('root');
  if(!loaded){ root.innerHTML = '<div class="loadmsg">Loading manifest…</div>'; return; }
  root.className='';
  root.innerHTML = `
    <div class="main">
      <div class="topbar">
        <div class="brand">747<small>Daily Manifest</small></div>
        <div class="tabbar">
          ${tabBtn('dashboard','Dashboard')}
          ${tabBtn('today','Today')}
          ${tabBtn('month','Month')}
          ${tabBtn('quarter','Quarter')}
        </div>
      </div>
      ${renderTab()}
    </div>
  `;
  attachHandlers();
}
function tabBtn(id,label){
  return `<button class="tabbtn ${activeTab===id?'active':''}" data-nav="${id}">${label}</button>`;
}
function renderTab(){
  if(activeTab==='dashboard') return renderDashboard();
  if(activeTab==='today') return renderToday();
  if(activeTab==='month') return renderMonth();
  if(activeTab==='quarter') return renderQuarter();
  if(activeTab==='evidence') return renderEvidence();
}

// ---------- DASHBOARD ----------
function renderDashboard(){
  const t0 = todayStr();
  const subTotal = state.finances.subs.reduce((a,s)=>a+s.amount,0);
  const q3Sum = state.deals.filter(d=>d.stage==='booked' && d.date>='2026-07-01' && d.date<='2026-09-30').reduce((a,d)=>a+(d.value||0),0);
  const q3Pct = Math.min(100, Math.round(q3Sum/5000*100));

  const portfolioTasks = state.projects.filter(p=>p.type==='portfolio');
  const portfolioDone = portfolioTasks.filter(p=>p.status==='done').length;
  const portfolioPct = portfolioTasks.length ? Math.round(portfolioDone/portfolioTasks.length*100) : 0;

  const dealDates = [...new Set(state.deals.map(d=>d.date))].sort().reverse();

  return `
    <div class="datebar">${fmtDate(t0)}</div>
    <h1>Dashboard</h1>

    <div class="card">
      <h2>Q3 Goal: $5,000</h2>
      <div class="proglabel"><span>${money(q3Sum)} booked</span><span>${q3Pct}%</span></div>
      <div class="progbar"><div class="progfill" style="width:${q3Pct}%;"></div></div>
      <div class="checkin-q" style="margin-top:10px;">Based on the Chime pitch ($800): at that deal size, ~7 deals closes this out. At a $500 average, ~10 deals. Assuming roughly 1-in-6 pitches closes (a placeholder assumption until you have real data), that's 40-60 pitches across the ~10 weeks left — under 1/day, well inside the 5/day pace already in your plan. The real lever isn't pitch volume, it's whether design leads (bigger ticket) land — 2-3 of those alone could cover most of it.</div>
      <div class="checkin-q" style="margin-top:6px;">This bar only counts deals marked "booked" below — pitched/negotiating deals show progress toward the goal, not the goal itself.</div>
    </div>

    <div class="card">
      <h2>Subscriptions <span style="font-size:11px;color:var(--muted);font-weight:400;">${money(subTotal)}/mo</span></h2>
      ${state.finances.subs.length ? state.finances.subs.map(s=>`
        <div class="finrow"><span>${escapeHtml(s.name)} <span style="color:var(--muted);font-size:11px;">renews ${s.renewDate||'—'}</span></span><span class="amt out">${money(s.amount)}<button class="smallx" data-delete-sub="${s.id}">×</button></span></div>
      `).join('') : '<div class="empty">No subscriptions tracked.</div>'}
      <div class="addrow">
        <input type="text" id="subName" placeholder="Subscription name">
        <input type="number" id="subAmount" placeholder="$/mo">
        <input type="date" id="subRenew">
        <button class="primary" data-action="addSub">Add sub</button>
      </div>
    </div>

    <div class="card">
      <h2>Pitches <span style="font-size:11px;color:var(--muted);font-weight:400;">${state.pitchLog[t0]||0} sent today</span></h2>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button class="primary" data-action="pitchPlus">+1 sent today</button>
        <button class="ghost" data-action="pitchMinus">−1</button>
      </div>
      ${dealDates.length ? dealDates.map(date=>`
        <div style="margin-bottom:12px;">
          <div class="listitem-meta" style="margin-bottom:6px;">${fmtDate(date)}${date===t0?' · TODAY':''} — ${state.pitchLog[date]||0} pitch${(state.pitchLog[date]||0)===1?'':'es'}</div>
          ${state.deals.filter(d=>d.date===date).map(d=>`
            <div class="miniitem">
              <span class="name">${escapeHtml(d.brand)}${d.value?` — ${money(d.value)}`:''}</span>
              <select data-deal-stage="${d.id}">${STAGES.map(s=>`<option value="${s}" ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select>
              <button class="smallx" data-delete-deal="${d.id}">×</button>
            </div>
          `).join('')}
        </div>
      `).join('') : '<div class="empty">No pitches logged yet.</div>'}
      <div class="addrow">
        <input type="text" id="dealInput" placeholder="Brand name...">
        <input type="number" id="dealValue" placeholder="$ value">
        <select id="dealStage">${STAGES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        <button class="primary" data-action="addDeal">Add pitch</button>
      </div>
    </div>

    <div class="grid3">
      ${renderProgressCard('Portfolio', portfolioPct, portfolioDone, portfolioTasks.length, 'gold', 'portfolioExpanded', renderPortfolioExpanded())}
      ${renderMilestoneCard('Weavy', 'weavy', 'sage')}
      ${renderMilestoneCard('Webflow', 'webflow', 'teal')}
    </div>
  `;
}

// ---------- TODAY ----------
function renderToday(){
  const t0 = todayStr();
  const isActualToday = todayViewDate===t0;
  const dayTasks = state.tasks.filter(t=>t.date===todayViewDate);

      <button class="ghost" data-action="nextDay">Next day ›</button>
    </div>
    <h1>${isActualToday?'Today':fmtDate(todayViewDate)}</h1>
    ${!isActualToday?`<button class="ghost" data-action="jumpToday" style="margin-bottom:16px;">Jump back to today</button>`:''}

    <div class="card">
      <h2>Mapped to the day</h2>
      ${renderTimeline(dayTasks)}

    <div class="today-grid">
      <div>
        <div class="card">
          <h2>${isActualToday?"Today's tasks":'Tasks for this day'}</h2>
          ${grouped.length ? grouped.map(g=>`<div style="margin-bottom:10px;">${g.items.map(t=>taskRowHTML(t,true)).join('')}</div>`).join('') : '<div class="empty">Nothing scheduled yet.</div>'}
          <div class="addrow">
            <input type="text" id="todayTaskInput" placeholder="Add a task...">
            <input type="time" id="todayTaskTime">
            <select id="todayTaskCat">${CATEGORIES.map(c=>`<option value="${c}">${CATEGORY_LABEL[c]}</option>`).join('')}</select>
            <button class="primary" data-action="addTodayTask">Add</button>
          </div>
        </div>
        ${isActualToday?`
        <div class="card">
          <h2>End of day</h2>
          <div class="checkin-q">What actually got done today:</div>
          ${(()=>{
            const doneToday = state.tasks.filter(t=>t.date===t0 && t.done).map(t=>t.title);
            const pc = state.pitchLog[t0]||0;
            const bullets = [...doneToday];
            if(pc>0) bullets.push(`${pc} pitch${pc>1?'es':''} sent`);
            return bullets.length ? `<div class="milestonelist" style="margin-top:0;padding-top:0;border-top:none;">${bullets.map(b=>`<div style="font-size:13px;padding:4px 0;">• ${escapeHtml(b)}</div>`).join('')}</div>` : '<div class="empty">Nothing checked off yet — check tasks off above as you go.</div>';
          })()}
          <div class="checkin-q" style="margin-top:12px;">Anything else to add before this gets logged:</div>
          <textarea id="eodInput" placeholder="Optional — anything the checklist doesn't capture..."></textarea>
          <button class="primary" data-action="submitEOD">Add evidence</button>
          <div style="margin-top:10px;"><a href="#" data-action="viewEvidence" style="color:var(--muted);font-size:12px;">View all evidence logs →</a></div>
        </div>
        `:''}
      </div>
    </div>
  `;
}
function renderTimeline(dayTasks){
  const unscheduled = dayTasks.filter(t=>!t.time);
  let html = '';
  if(unscheduled.length){
    html += `<div style="margin-bottom:12px;">
      <div class="checkin-q" style="margin-bottom:6px;">No time set</div>
      ${unscheduled.map(t=>`<div class="timeblock ${t.category} ${t.done?'done':''}">${escapeHtml(t.title)}</div>`).join('')}
    </div>`;
  }
  for(let h=6; h<=22; h++){
    const items = dayTasks.filter(t=>t.time && parseInt(t.time.split(':')[0],10)===h);
    html += `<div class="hourrow">
      <div class="hourlabel">${fmtHour(h)}</div>
      <div class="hourtasks">${items.map(t=>`<div class="timeblock ${t.category} ${t.done?'done':''}">${t.time} · ${escapeHtml(t.title)}</div>`).join('')}</div>
    </div>`;
  }
  return html;
}
function taskRowHTML(t, showPush){
  return `
    <div class="taskrow ${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} data-toggle-task="${t.id}">
      <span class="tag ${t.category}">${CATEGORY_LABEL[t.category]}</span>
      ${t.fromCalendar?'<span class="tag" style="background:rgba(91,138,130,.2);color:var(--teal);">📅 cal</span>':''}
      ${t.time?`<span class="time">${t.time}</span>`:''}
      <span class="title">${escapeHtml(t.title)}</span>
      ${showPush?`<button class="ghost" style="padding:3px 8px;font-size:11px;" data-push-tomorrow="${t.id}">→ Tomorrow</button>`:''}
      <button class="smallx" data-delete-task="${t.id}">×</button>
    </div>
  `;
}

// ---------- MONTH ----------
function renderMonth(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth()+monthOffset);
  const year = base.getFullYear(), month = base.getMonth();
  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthName = base.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const t0 = todayStr();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="calcell empty2"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = dateStr(year,month,d);
    const dayTasks = state.tasks.filter(t=>t.date===ds);
    const cats = [...new Set(dayTasks.map(t=>t.category))];
    cells += `<div class="calcell ${ds===t0?'today':''} ${ds===selectedDate?'selected':''}" data-day="${ds}">
      <div class="daynum">${d}</div>
      <div class="caldots">${cats.map(c=>`<span class="caldot ${c}"></span>`).join('')}</div>
    </div>`;
  }
  const selTasks = state.tasks.filter(t=>t.date===selectedDate).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

  return `
    <div class="card">
      <div class="navrow">
        <button class="ghost" data-action="prevMonth">‹ Prev</button>
        <div class="qmonth-title" style="margin:0;">${monthName}</div>
        <button class="ghost" data-action="nextMonth">Next ›</button>
      </div>
      <div class="calgrid">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="calhead">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="today-grid">
      <div class="card">
        <h2>${fmtDate(selectedDate)}</h2>
        ${selTasks.length ? selTasks.map(t=>taskRowHTML(t)).join('') : '<div class="empty">Nothing on this day.</div>'}
        <div class="addrow">
          <input type="text" id="monthTaskInput" placeholder="Add content plan / any task for this day...">
          <input type="time" id="monthTaskTime">
          <select id="monthTaskCat">${CATEGORIES.map(c=>`<option value="${c}">${CATEGORY_LABEL[c]}</option>`).join('')}</select>
          <button class="primary" data-action="addMonthTask">Add</button>
        </div>
      </div>
      <div class="card" style="align-self:start;">
        <h2>Mapped to the day</h2>
        ${renderTimeline(selTasks)}
      </div>
    </div>
  `;
}

// ---------- QUARTER ----------
function renderQuarter(){
  const now = new Date();
  const qStartMonth = Math.floor(now.getMonth()/3)*3;
  const year = now.getFullYear();
  const monthCards = [0,1,2].map(offset=>{
    const m = qStartMonth+offset;
    const monthName = new Date(year,m,1).toLocaleDateString('en-US',{month:'long'});
    const monthTasks = state.tasks.filter(t=>{ const [ty,tm]=t.date.split('-').map(Number); return ty===year && (tm-1)===m; });
    const done = monthTasks.filter(t=>t.done).length;
    const byCat = CATEGORIES.map(c=>({c, n: monthTasks.filter(t=>t.category===c).length})).filter(x=>x.n);
    const dealsInMonth = state.deals.filter(d=>{ const [dy,dm]=d.date.split('-').map(Number); return dy===year && (dm-1)===m; });
    const finInMonth = state.finances.entries.filter(e=>{ const [fy,fm]=e.date.split('-').map(Number); return fy===year && (fm-1)===m; });
    const inSum = finInMonth.filter(e=>e.type==='in').reduce((a,e)=>a+e.amount,0);
    const outSum = finInMonth.filter(e=>e.type==='out').reduce((a,e)=>a+e.amount,0);
    return `
      <div class="card">
        <div class="qmonth-title">${monthName} ${year}</div>
        <div class="statrow"><span>Tasks logged</span><span class="n">${monthTasks.length}</span></div>
        <div class="statrow"><span>Completed</span><span class="n">${done}</span></div>
        ${byCat.map(x=>`<div class="statrow"><span>${CATEGORY_LABEL[x.c]}</span><span class="n">${x.n}</span></div>`).join('')}
        <div class="statrow"><span>UGC deals added</span><span class="n">${dealsInMonth.length}</span></div>
        <div class="statrow"><span>Income logged</span><span class="n">${money(inSum)}</span></div>
        <div class="statrow"><span>Expenses logged</span><span class="n">${money(outSum)}</span></div>
      </div>
    `;
  }).join('');

  return `
    <div class="datebar">Q${Math.floor(qStartMonth/3)+1} ${year}</div>
    <h1>Quarter</h1>
    <div class="card">
      <h2>Q3 Goals</h2>
      <textarea id="q3GoalsInput" style="min-height:110px;">${escapeHtml(state.q3goals || "$5,000 through design leads\nUGC deals (leaning into Canvas UGC over one-off deals)\nSev content running as passive income")}</textarea>
      <button class="primary" data-action="saveQ3Goals">Save</button>
    </div>
    <div class="grid3">${monthCards}</div>
  `;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{ el.onclick = ()=>setTab(el.getAttribute('data-nav')); });
  const viewEvidenceLink = document.querySelector('[data-action="viewEvidence"]');
  if(viewEvidenceLink) viewEvidenceLink.onclick = (e)=>{ e.preventDefault(); activeTab='evidence'; render(); };
  const backToTodayLink = document.querySelector('[data-action="backToToday"]');
  if(backToTodayLink) backToTodayLink.onclick = (e)=>{ e.preventDefault(); activeTab='today'; render(); };
  document.querySelectorAll('[data-toggle-task]').forEach(el=>{ el.onchange = ()=>toggleTask(el.getAttribute('data-toggle-task')); });
  document.querySelectorAll('[data-delete-task]').forEach(el=>{ el.onclick = ()=>deleteTask(el.getAttribute('data-delete-task')); });
  document.querySelectorAll('[data-deal-stage]').forEach(el=>{ el.onchange = ()=>updateDealStage(el.getAttribute('data-deal-stage'), el.value); });
  document.querySelectorAll('[data-delete-deal]').forEach(el=>{ el.onclick = ()=>deleteDeal(el.getAttribute('data-delete-deal')); });
  document.querySelectorAll('[data-project-status]').forEach(el=>{ el.onchange = ()=>updateProjectStatus(el.getAttribute('data-project-status'), el.value); });
  document.querySelectorAll('[data-delete-project]').forEach(el=>{ el.onclick = ()=>deleteProject(el.getAttribute('data-delete-project')); });
  document.querySelectorAll('[data-delete-log]').forEach(el=>{ el.onclick = ()=>deleteLog(el.getAttribute('data-delete-log')); });
  document.querySelectorAll('[data-day]').forEach(el=>{ el.onclick = ()=>{ selectedDate = el.getAttribute('data-day'); render(); }; });
  document.querySelectorAll('[data-toggle-ui]').forEach(el=>{ el.onclick = ()=>{ const k=el.getAttribute('data-toggle-ui'); ui[k]=!ui[k]; render(); }; });
  document.querySelectorAll('[data-delete-sub]').forEach(el=>{ el.onclick = ()=>deleteSub(el.getAttribute('data-delete-sub')); });
  document.querySelectorAll('[data-delete-fin]').forEach(el=>{ el.onclick = ()=>deleteFinanceEntry(el.getAttribute('data-delete-fin')); });
  document.querySelectorAll('[data-toggle-milestone]').forEach(el=>{
    el.onchange = ()=>{ const [track,id]=el.getAttribute('data-toggle-milestone').split(':'); toggleMilestone(track,id); };
  });
  document.querySelectorAll('[data-delete-milestone]').forEach(el=>{
    el.onclick = ()=>{ const [track,id]=el.getAttribute('data-delete-milestone').split(':'); deleteMilestone(track,id); };
  });

  const prevDayBtn = document.querySelector('[data-action="prevDay"]');
  if(prevDayBtn) prevDayBtn.onclick = ()=>{
    const d = new Date(todayViewDate+'T00:00:00'); d.setDate(d.getDate()-1);
    todayViewDate = dateStr(d.getFullYear(),d.getMonth(),d.getDate()); render();
  };
  const nextDayBtn = document.querySelector('[data-action="nextDay"]');
  if(nextDayBtn) nextDayBtn.onclick = ()=>{
    const d = new Date(todayViewDate+'T00:00:00'); d.setDate(d.getDate()+1);
    todayViewDate = dateStr(d.getFullYear(),d.getMonth(),d.getDate()); render();
  };
  const jumpTodayBtn = document.querySelector('[data-action="jumpToday"]');
  if(jumpTodayBtn) jumpTodayBtn.onclick = ()=>{ todayViewDate = todayStr(); render(); };

  const prevBtn = document.querySelector('[data-action="prevMonth"]');
  if(prevBtn) prevBtn.onclick = ()=>{ monthOffset--; render(); };
  const nextBtn = document.querySelector('[data-action="nextMonth"]');
  if(nextBtn) nextBtn.onclick = ()=>{ monthOffset++; render(); };

  const addTodayBtn = document.querySelector('[data-action="addTodayTask"]');
  if(addTodayBtn) addTodayBtn.onclick = ()=>{
    const input = document.getElementById('todayTaskInput');
    const cat = document.getElementById('todayTaskCat').value;
    const time = document.getElementById('todayTaskTime').value;
    addTask(input.value, cat, todayViewDate, time);
  };
  const addMonthBtn = document.querySelector('[data-action="addMonthTask"]');
  if(addMonthBtn) addMonthBtn.onclick = ()=>{
    const input = document.getElementById('monthTaskInput');
    const cat = document.getElementById('monthTaskCat').value;
    const time = document.getElementById('monthTaskTime').value;
    addTask(input.value, cat, selectedDate, time);
  };
  const addDealBtn = document.querySelector('[data-action="addDeal"]');
  if(addDealBtn) addDealBtn.onclick = ()=>{
    const input = document.getElementById('dealInput');
    const stage = document.getElementById('dealStage').value;
    const value = document.getElementById('dealValue').value;
    addDeal(input.value, stage, value);
  };
  document.querySelectorAll('[data-push-tomorrow]').forEach(el=>{ el.onclick = ()=>pushTaskToTomorrow(el.getAttribute('data-push-tomorrow')); });
  const eodBtn = document.querySelector('[data-action="submitEOD"]');
  if(eodBtn) eodBtn.onclick = ()=>{
    const input = document.getElementById('eodInput');
    const text = input.value;
    const t0 = todayStr();
    const bullets = [];
    state.tasks.filter(t=>t.date===t0 && t.done).forEach(t=>bullets.push(t.title));
    const pitchCount = state.pitchLog[t0]||0;
    if(pitchCount>0) bullets.push(`${pitchCount} pitch${pitchCount>1?'es':''} sent`);
    if(text.trim()) bullets.push(text.trim());
    const summary = bullets.length ? bullets.map(b=>'• '+b).join('\n') : '(nothing marked complete)';
    addLog(summary);
    activeTab = 'evidence';
    render();
  };
  const manualLogBtn = document.querySelector('[data-action="addManualLog"]');
  if(manualLogBtn) manualLogBtn.onclick = ()=>{
    const input = document.getElementById('manualLogInput');
    addLog(input.value);
    input.value='';
  };
  const addSubBtn = document.querySelector('[data-action="addSub"]');
  if(addSubBtn) addSubBtn.onclick = ()=>{
    addSub(document.getElementById('subName').value, document.getElementById('subAmount').value, document.getElementById('subRenew').value);
  };
  const addFinBtn = document.querySelector('[data-action="addFin"]');
  if(addFinBtn) addFinBtn.onclick = ()=>{
    addFinanceEntry(document.getElementById('finType').value, document.getElementById('finAmount').value, document.getElementById('finNote').value);
  };
  const pitchPlusBtn = document.querySelector('[data-action="pitchPlus"]');
  if(pitchPlusBtn) pitchPlusBtn.onclick = ()=>bumpPitch(1);
  const pitchMinusBtn = document.querySelector('[data-action="pitchMinus"]');
  if(pitchMinusBtn) pitchMinusBtn.onclick = ()=>bumpPitch(-1);
  const addPortfolioBtn = document.querySelector('[data-action="addPortfolioTask"]');
  if(addPortfolioBtn) addPortfolioBtn.onclick = ()=>{
    addProject(document.getElementById('portfolioInput').value, 'portfolio');
  };
  const saveQ3Btn = document.querySelector('[data-action="saveQ3Goals"]');
  if(saveQ3Btn) saveQ3Btn.onclick = ()=>{
    state.q3goals = document.getElementById('q3GoalsInput').value;
    saveState(); render();
  };
  document.querySelectorAll('[data-action="addMilestone"]').forEach(el=>{
    el.onclick = ()=>{
      const track = el.getAttribute('data-track');
      const input = document.getElementById('milestoneInput-'+track);
      addMilestone(track, input.value);
    };
  });
}
